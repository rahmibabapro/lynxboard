<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090d14">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="./widget.css">
    <title>Development Board widget</title>
  </head>
  <body>
    <main class="widget" aria-labelledby="overall-label">
      <header class="widget-topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>LYNXBOARD</span>
        </div>
        <div class="topbar-actions">
          <span class="live-badge"><span aria-hidden="true"></span>Live</span>
          <a
            class="project-link"
            id="project-link"
            href="https://github.com/users/rahmibabapro/projects/1"
            target="_blank"
            rel="noopener noreferrer"
          >View board <span aria-hidden="true">↗</span></a>
        </div>
      </header>

      <section class="milestone" aria-labelledby="milestone-label">
        <div class="milestone-heading">
          <h1 id="milestone-label">Loading next build…</h1>
          <time id="milestone-date">—</time>
        </div>
        <div
          class="milestone-rail"
          id="milestone-rail"
          role="progressbar"
          aria-label="Time until next build"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        ><span></span></div>
        <p class="last-build">Snapshot: <time id="last-build">—</time></p>
      </section>

      <section class="progress-panel" aria-labelledby="overall-label">
        <div class="overall-heading">
          <h2 id="overall-label">Development Board - 0%</h2>
          <p id="task-count">0 Tasks</p>
        </div>
        <div class="group-list" id="group-list" aria-live="polite">
          <div class="group-placeholder"></div>
          <div class="group-placeholder"></div>
          <div class="group-placeholder"></div>
        </div>
        <p class="changes" id="changes">0 Changes in last 24hrs</p>
      </section>

      <section class="timeline-panel" aria-label="Current priority timeline">
        <ol class="timeline" id="timeline" aria-live="polite">
          <li class="timeline-placeholder"></li>
          <li class="timeline-placeholder"></li>
          <li class="timeline-placeholder"></li>
          <li class="timeline-placeholder"></li>
        </ol>
      </section>

      <p class="sync-state" id="sync-state" role="status">Reading GitHub Project…</p>
    </main>

    <script type="module" src="./widget.mjs"></script>
  </body>
</html>
