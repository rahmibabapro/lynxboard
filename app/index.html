<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111318">
    <meta name="description" content="Live GitHub Project progress in an embeddable LynxBoard widget.">
    <meta property="og:title" content="LynxBoard — live GitHub Project widget">
    <meta property="og:description" content="A calm Quiet Winter status view synced from GitHub Projects.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://rahmibabapro.github.io/lynxboard/social-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="alternate" type="application/atom+xml" title="LynxBoard updates" href="./feed.xml">
    <link rel="icon" href="./assets/lynx-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>LynxBoard — live GitHub Project widget</title>
  </head>
  <body>
    <main class="widget-stage">
      <lynx-board
        height="661"
        refresh="30"
        title="Rahmi's live GitHub Project progress"
      >
        <p class="loading-copy">Loading GitHub Project…</p>
      </lynx-board>
    </main>

    <script type="module" src="./embed.mjs"></script>
  </body>
</html>
